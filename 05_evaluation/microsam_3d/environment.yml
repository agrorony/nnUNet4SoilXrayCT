name: microsam3d
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - pytorch-cuda=11.8
  - cudatoolkit
  - pip
  - pip:
      - micro-sam
      - napari[all]
      - magicgui
      - tifffile
      - zarr
      - scipy
      - numpy
      - qtpy
      - pyqt5
      - nibabel
      - psutil
